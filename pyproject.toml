[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-tracker"
version = "1.0.0"
description = "Personal Habit & Daily Life Tracker - a modular Python/Streamlit personal operating system."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Habit Tracker Contributors" }]
keywords = ["habits", "productivity", "streamlit", "tracker", "analytics"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "streamlit>=1.40",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "plotly>=5.22",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pandas-stubs",
    "types-python-dateutil",
]

[project.scripts]
# The command-line tracker. `habits --help` after `pip install -e .`;
# `python main.py --help` works straight from a clone with no install.
habits = "app.cli.__main__:main"
habit-tracker-seed = "scripts.seed_data:main"
habit-tracker-backup = "scripts.backup:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
app = ["database/migrations/*.py", "database/migrations/**/*.py", "database/migrations/*.mako"]

# ---------------------------------------------------------------------------
# Ruff - linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle (PEP 257)
    "ANN",  # flake8-annotations (PEP 484)
    "TID",  # tidy imports
    "DTZ",  # flake8-datetimez
]
ignore = [
    "D107",   # __init__ docstring - class docstring covers it
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ANN401", # Any is occasionally the honest annotation
    "B008",   # function call in default arg - used deliberately for DI defaults
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ANN202"]
# The UI uses emoji as status icons and typographic separators on purpose;
# RUF001 flags them as confusable with ASCII, which they are not here.
"app/ui/*" = ["RUF001"]
"scripts/*" = ["D100"]
"app/database/migrations/env.py" = ["D100", "ANN201", "ANN001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Black - formatting (kept aligned with ruff format for teams using either)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "app/database/migrations/versions"

# ---------------------------------------------------------------------------
# Mypy - static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = true
warn_unreachable = false
show_error_codes = true
pretty = true
exclude = ["app/database/migrations/versions/", "build/"]

[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*", "alembic.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that touch a real (temporary) database",
    "slow: tests that are deliberately heavy (performance smoke tests)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/ui/*", "app/main.py", "app/database/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]

# Alembic configuration.
#
# `sqlalchemy.url` is intentionally left blank: the real URL comes from
# `app.config.settings`, so there is exactly one place a database is named
# and no chance of migrations running against a different one than the app.

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

# Name new revision files after their timestamp and slug, so `ls` shows the
# order the migrations actually run in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No post-write hook: `ruff` is not guaranteed to be on PATH for the
# subprocess Alembic would spawn, and a hook that fails on every generated
# revision is worse than none. Run `ruff format` yourself afterwards.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
